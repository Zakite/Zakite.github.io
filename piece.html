<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing &middot; Zak Jibrin</title>
<meta name="description" content="A piece of writing by Zakaria (Zak) Jibrin, PhD candidate in Earth and Planetary Sciences at Rutgers University.">
<meta name="theme-color" content="#10161E">
<!-- These pages mirror a working document, so they should not be indexed as
     though they were the published article. -->
<meta name="robots" content="noindex">

<!--
  piece.html — one page, every piece of writing.

  No Jekyll front matter, like index.html and cv.html, so Pages copies it
  through verbatim.

  The entry to show comes from the query string: piece.html?id=<key>, where
  the key is one of the entries in pieces.js. That file holds the Google Doc
  id; this file holds no ids at all, so adding a piece never means editing
  this page, and adding a piece never means creating a new page either.

  Rendering is the same machinery the CV uses (gdoc.js): fetch the document's
  export on every load and rebuild it in this site's typography, so the page
  is always current and nothing is committed.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Lora:ital,wght@0,400..600;1,400..600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #10161E;
  --bg-warm: #1A2330;
  --ink: #DCE8F0;
  --ink-soft: #BDCCD9;
  --muted: #9EB2C4;
  --rule: #26323F;
  --accent: #3FD9CB;

  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

  --max: 54rem;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; scroll-behavior: smooth; background: #070B11; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  margin-inline: 9vw;
}

::selection { background: var(--accent); color: var(--bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 2rem; }

/* ---------- Nav ---------- */
nav {
  padding: 1.4rem 0;
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 20;
  background: rgba(16, 22, 30, 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
nav .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.brand {
  font-family: var(--serif);
  font-variation-settings: "opsz" 36, "wght" 500;
  font-size: 1.05rem; font-weight: 500;
  color: var(--ink); text-decoration: none;
}
.brand .j { font-family: 'Lora', Georgia, serif; font-size: 1.02em; }
.brand em { font-style: italic; color: var(--accent); font-weight: 400; }
.nav-links { display: flex; gap: 1.6rem; list-style: none; flex-wrap: wrap; align-items: baseline; }
.nav-links a {
  color: var(--muted); text-decoration: none;
  font-size: 0.85rem; font-weight: 600;
  transition: color 0.25s ease;
}
.nav-links a:hover, .nav-links a:focus-visible { color: var(--accent); outline: none; }
.nav-links .nav-cv {
  font-family: var(--serif); font-variation-settings: "opsz" 36, "wght" 600;
  font-size: 1.3rem; font-weight: 600; color: var(--accent); line-height: 1;
}
.nav-links .nav-cv:hover, .nav-links .nav-cv:focus-visible { color: var(--ink); }

/* ---------- Head ---------- */
.piece-head { padding: 3.5rem 0 1.9rem; border-bottom: 1px solid var(--rule); }
.piece-meta {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); display: block; margin-bottom: 1rem;
}
.piece-head h1 {
  font-family: var(--serif);
  font-variation-settings: "opsz" 72, "wght" 500;
  font-size: clamp(1.8rem, 4vw, 2.9rem);
  font-weight: 500; line-height: 1.12; letter-spacing: -0.02em;
  max-width: 26ch;
}
.piece-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.6rem; }
.piece-btn {
  font-family: var(--mono); font-size: 0.6rem; font-weight: 500;
  letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--muted); background: transparent;
  border: 1px solid var(--rule); padding: 0.28rem 0.6rem;
  cursor: pointer; text-decoration: none; display: inline-block;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.piece-btn:hover, .piece-btn:focus-visible {
  color: var(--bg); background: var(--accent); border-color: var(--accent); outline: none;
}

/* Failure only. A successful load says nothing: the writing is the message. */
.piece-status {
  display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem;
  margin-top: 1.6rem; padding: 0.75rem 1rem;
  border: 1px solid var(--rule); background: var(--bg-warm);
  font-family: var(--mono); font-size: 0.74rem;
  letter-spacing: 0.05em; color: var(--muted);
}
.piece-status[hidden] { display: none; }   /* display:flex would beat [hidden] */
.piece-status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); }
.piece-status.is-error { border-color: #AE3A22; }
.piece-status.is-error .dot { background: #F0724A; }
.piece-status a { color: var(--accent); }

/* ---------- Body ---------- */
#pieceBody { padding: 2.5rem 0 4rem; }
.piece-loading {
  font-family: var(--mono); font-size: 0.82rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding: 3rem 0;
}

#pieceBody h2 {
  font-family: var(--serif);
  font-variation-settings: "opsz" 60, "wght" 600;
  font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em;
  margin: 2.6rem 0 1rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
}
#pieceBody h2:first-child { margin-top: 0; }
#pieceBody p { margin: 0.9rem 0; max-width: 70ch; }
#pieceBody strong { font-weight: 600; }

/* The document can hand us tokens with no break opportunity in them: a
   slash-joined heading, a chemical name, a bare URL. On a narrow screen one
   of those pushes the whole page sideways, so let them break instead. */
#pieceBody h2, #pieceBody p, #pieceBody li,
.piece-head h1, .cv-row .cv-what { overflow-wrap: break-word; }
#pieceBody a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.cv-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 1.5rem; margin: 1.4rem 0 0.2rem;
}
.cv-row .cv-what { font-weight: 600; }
.cv-row .cv-when {
  font-family: var(--mono); font-size: 0.76rem; font-weight: 500;
  letter-spacing: 0.08em; color: var(--accent); white-space: nowrap; flex: none;
}

#pieceBody ul { list-style: none; margin: 0.6rem 0 1rem; }
#pieceBody li { position: relative; padding-left: 1.15rem; margin: 0.35rem 0; max-width: 70ch; }
#pieceBody li::before {
  content: "\25C7";
  position: absolute; left: 0; top: 0;
  color: var(--accent); font-size: 0.72em; line-height: 1.9;
}

/* ---------- Footer ---------- */
footer {
  padding: 2.5rem 0 3rem; border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 0.72rem;
  color: var(--muted); letter-spacing: 0.05em;
}
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 900px) {
  body { margin-inline: 4vw; }
  .wrap { padding: 0 1.5rem; }
  .piece-head { padding: 2.5rem 0 1.5rem; }
}
@media (max-width: 600px) {
  html { font-size: 17.5px; }
  body { margin-inline: 3vw; }
  /* Same stacked nav as the home page, so moving between the two does not
     rearrange the furniture: brand on top, section links wrapped and centred,
     CV large on a line of its own. */
  nav .wrap { flex-direction: column; align-items: center; gap: 0.5rem; }
  .nav-links { justify-content: center; gap: 0.55rem 1.05rem; }
  .nav-links .nav-cv-item {
    flex-basis: 100%;
    display: flex; justify-content: center;
    margin-top: 0.2rem;
  }
  .nav-links .nav-cv { font-size: 1.9rem; }
  .cv-row { flex-direction: column; gap: 0.15rem; }
}

@media print {
  @page { margin: 1.6cm; }
  html { font-size: 11pt; background: #FFF; }
  body { margin-inline: 0; background: #FFF; color: #000; }
  nav, .piece-status, .piece-actions, footer { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .piece-head { padding: 0 0 0.8rem; }
  #pieceBody { padding: 1rem 0 0; }
  #pieceBody h2 { margin-top: 1.4rem; break-after: avoid; }
  .cv-row, #pieceBody li { break-inside: avoid; }
  .cv-row .cv-when, #pieceBody li::before, #pieceBody a { color: #000; }
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="index.html" class="brand">Zakaria <em><span class="j">J</span>ibrin</em></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#research">Research</a></li>
      <li><a href="index.html#writing">Writing</a></li>
      <li><a href="index.html#cpa">CPA</a></li>
      <li><a href="index.html#elsewhere">Elsewhere</a></li>
      <li class="nav-cv-item"><a href="cv.html" class="nav-cv">CV</a></li>
    </ul>
  </div>
</nav>

<header class="piece-head">
  <div class="wrap">
    <span class="piece-meta" id="pieceMeta"></span>
    <h1 id="pieceTitle">Writing</h1>

    <div class="piece-actions" id="pieceActions" hidden>
      <button type="button" class="piece-btn" id="piecePrint">Print</button>
    </div>

    <div class="piece-status" id="pieceStatus" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="pieceStatusText"></span>
    </div>
  </div>
</header>

<main id="pieceBody">
  <div class="wrap">
    <p class="piece-loading" id="pieceLoading">Loading&hellip;</p>
    <noscript>
      <p>This page renders a working document live, which needs JavaScript.
      <a href="index.html#writing">Back to the writing list</a>.</p>
    </noscript>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Rutgers University &middot; Piscataway, NJ</span>
    <span><a href="index.html#writing">&larr; All writing</a></span>
  </div>
</footer>

<script src="pieces.js"></script>
<script src="gdoc.js"></script>
<script>
(function () {
  var mount   = document.querySelector('#pieceBody .wrap');
  var loading = document.getElementById('pieceLoading');
  var box     = document.getElementById('pieceStatus');
  var boxTxt  = document.getElementById('pieceStatusText');
  var actions = document.getElementById('pieceActions');
  var printBtn = document.getElementById('piecePrint');
  if (!mount) return;

  printBtn.addEventListener('click', function () { window.print(); });

  function say(msg, linkHref, linkText, isError) {
    if (loading) loading.remove();
    box.hidden = false;
    if (isError) box.classList.add('is-error');
    boxTxt.textContent = msg + ' ';
    if (linkHref) {
      var a = document.createElement('a');
      a.href = linkHref;
      a.textContent = linkText;
      a.rel = 'noopener noreferrer';
      boxTxt.appendChild(a);
    }
  }

  var id = new URLSearchParams(location.search).get('id');
  var piece = id && window.PIECES ? window.PIECES[id] : null;

  /* An id that is not in the manifest at all: a stale or hand-typed link. */
  if (!piece) {
    document.title = 'Writing · Zak Jibrin';
    say('That piece is not listed.', 'index.html#writing', 'See the writing list', true);
    return;
  }

  document.title = piece.title + ' · Zak Jibrin';
  document.getElementById('pieceTitle').textContent = piece.title;
  document.getElementById('pieceMeta').textContent = piece.meta || '';

  /* Listed, but no document behind it yet. Not an error -- the entry simply
     is not readable, which is the ordinary state of a manuscript in prep. */
  if (!piece.doc) {
    say('This one is still being written, so there is nothing to read yet.',
        'index.html#writing', 'Back to the writing list', false);
    return;
  }

  window.GDoc.load(piece.doc)
    .then(function (frag) {
      if (loading) loading.remove();
      mount.appendChild(frag);
      actions.hidden = false;
    })
    .catch(function () {
      say('Could not reach the source document right now.',
          window.GDoc.viewUrl(piece.doc), 'Open it directly', true);
    });
})();
</script>
</body>
</html>
